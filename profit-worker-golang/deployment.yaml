apiVersion: apps/v1
kind: Deployment
metadata:
  name: profit-worker-golang
spec:
  replicas: 4
  selector:
    matchLabels:
      app: profit-worker-golang
  template:
    metadata:
      labels:
        app: profit-worker-golang
    spec:
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: profit-worker-golang
          image: cmh1448/finvibe-profit-worker-golang:8172ba5
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: redis-password

            # [일반 설정]
            - name: HTTP_ADDR
              value: ":8080"
            - name: REDIS_HOST
              value: "redis-external"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_ADDR
              value: "redis-external:6379"
            - name: REDIS_MODE
              value: "cluster"
            - name: REDIS_CLUSTER_NODES
              value: "redis-cluster-0.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-1.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-2.redis-cluster-headless.finvibe.svc.cluster.local:6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-external:9092"
            - name: KAFKA_CONCURRENCY_STOCK_PRICE
              value: "6"
            - name: KAFKA_CONCURRENCY_TRADE
              value: "1"
            - name: KAFKA_CONCURRENCY_PORTFOLIO
              value: "1"
            - name: KAFKA_GROUP_PROTOCOL
              value: "consumer"
            - name: KAFKA_MAX_POLL_RECORDS
              value: "100"
            - name: KAFKA_BATCH_MAX_WAIT_MS
              value: "50"

          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          ports:
            - containerPort: 8080
