fullnameOverride: kafka

global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/kafka
  tag: "4.0.0"

defaultInitContainers:
  prepareConfig:
    image:
      registry: docker.io
      repository: bitnamilegacy/kafka
      tag: "4.0.0"

listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
  external:
    protocol: PLAINTEXT

controller:
  replicaCount: 3
  controllerOnly: true
  podAntiAffinityPreset: soft
  heapOpts: "-Xms256m -Xmx384m"
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 640Mi
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: controller
          app.kubernetes.io/instance: kafka
          app.kubernetes.io/name: kafka
          app.kubernetes.io/part-of: kafka

broker:
  replicaCount: 3
  podAntiAffinityPreset: soft
  heapOpts: "-Xms512m -Xmx768m"
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: broker
          app.kubernetes.io/instance: kafka
          app.kubernetes.io/name: kafka
          app.kubernetes.io/part-of: kafka

service:
  type: ClusterIP
  ports:
    client: 9092

externalAccess:
  enabled: false

overrideConfiguration:
  default.replication.factor: "1"
  min.insync.replicas: "1"
  offsets.topic.replication.factor: "1"
  transaction.state.log.replication.factor: "1"
  transaction.state.log.min.isr: "1"

metrics:
  jmx:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/jmx-exporter
      tag: "1.4.0"
    serviceMonitor:
      enabled: false
