apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gamification
  template:
    metadata:
      labels:
        app: gamification
    spec:
      containers:
        - name: gamification
          image: cmh1448/finvibe-gamification:171bf50
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: db-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: redis-password
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: mongo-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finvibe-jwt-secret
                  key: secret
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: gemini-api-key

            # [일반 설정]
            - name: DB_URL
              value: "jdbc:mariadb://mariadb-external:3306/finvibe"
            - name: REDIS_HOST
              value: "redis-external"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-external:9092"
          ports:
            - containerPort: 8080
