apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    # 모놀리식은 CPU 요청 1이라 롤링 중 두 파드가 함께 뜰 자리가 없다(다른 노드는 taint).
    # 이전 파드를 먼저 내리고 새 파드를 올린다. KIS 자격증명 쟁탈도 함께 피한다(#17).
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: cmh1448/finvibe-monolith:3a414b8
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: db-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: redis-password
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: mongo-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finvibe-jwt-secret
                  key: secret
            - name: KIS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: kis-api-key
            - name: KIS_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: kis-api-secret
            - name: KIS_USER_ID
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: kis-user-id
            - name: KIS_API_KEY_2
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: kis-api-key2
            - name: KIS_API_SECRET_2
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: kis-api-secret2
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: gemini-api-key

            # [일반 설정]
            - name: DB_URL
              value: "jdbc:mariadb://mariadb-external:3306/finvibe"
            - name: REDIS_HOST
              value: "redis-external"
            - name: REDIS_MODE
              value: "cluster"
            - name: REDIS_CLUSTER_NODES
              value: "redis-cluster-0.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-1.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-2.redis-cluster-headless.finvibe.svc.cluster.local:6379"
            - name: SPRING_DATA_REDIS_CLUSTER_NODES
              value: "redis-cluster-0.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-1.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-2.redis-cluster-headless.finvibe.svc.cluster.local:6379"
            - name: SPRING_REDIS_CLUSTER_NODES
              value: "redis-cluster-0.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-1.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-2.redis-cluster-headless.finvibe.svc.cluster.local:6379"
            - name: MARKET_REDIS_PUBSUB_CURRENT_PRICE_UPDATED_PARTITION_COUNT
              value: "3"
            - name: MARKET_REDIS_PUBSUB_CURRENT_PRICE_UPDATED_MODE
              value: "sharded"
            # 테스트 시세 프로바이더(부하 시험 #17). 되돌릴 때는 이 블록을 지우면 기본값(kis)으로 돌아간다.
            # 증량 스케줄: 단계별 초당 목표 건수를 5분씩. 긴급 제어: redis-cli SET market:mock:control stop|hold|<숫자>
            - name: MARKET_PROVIDER
              value: "mock"
            - name: MARKET_MOCK_EMITINTERVALMS
              value: "200"
            - name: MARKET_MOCK_RAMPSTEPS
              value: "100,250,500,1000,2500,5000,10000,20000,37000"
            - name: MARKET_MOCK_RAMPSTEPSECONDS
              value: "300"
            - name: MARKET_MOCK_PUBLISHTHREADS
              value: "4"
            - name: MARKET_MOCK_PUBLISHQUEUECAPACITY
              value: "64"
            # 현재가 경로만 측정(#17 D10): 수익률 워커로 가는 시세 Kafka 발행을 끈다. 수익률 시험 때 true로 되돌린다.
            - name: MARKET_PRICEEVENTS_KAFKAENABLED
              value: "false"
            # 메모리 1Gi에서 JVM이 Serial GC·힙 25%(260MB)를 골라, 초당 1만 건에서 전체 GC가 최대 0.8초 멈췄다(#17 D21).
            - name: JAVA_TOOL_OPTIONS
              # 레인 대기 원인 프로파일링(#17 D22): 기동 14분 뒤부터 5분 기록. 분석 후 JFR 부분은 제거한다.
              value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75 -XX:StartFlightRecording=delay=14m,duration=5m,settings=profile,filename=/tmp/lane.jfr"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-external:9092"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          # 현재가 경로가 CPU 한도(0.7)에 막혀 늘린다(#17). 메모리는 기존 클러스터 값 그대로.
          resources:
            requests:
              cpu: "1"
              memory: "1536Mi"
            limits:
              cpu: "2"
              memory: "1536Mi"
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            # 기동이 약 290초 걸려 5분 한도에 걸린다. 롤링 중 노드 CPU 경합까지 감안해 10분을 허용한다.
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
