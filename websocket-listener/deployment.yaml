apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-listener
spec:
  replicas: 3
  selector:
    matchLabels:
      app: websocket-listener
  template:
    metadata:
      labels:
        app: websocket-listener
    spec:
      containers:
        - name: websocket-listener
          image: cmh1448/finvibe-websocket-listener:bc0c430
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finvibe-app-secrets
                  key: redis-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finvibe-jwt-secret
                  key: secret

            # [일반 설정]
            - name: REDIS_HOST
              value: "redis-external"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_MODE
              value: "cluster"
            - name: REDIS_CLUSTER_NODES
              value: "redis-cluster-0.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-1.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-2.redis-cluster-headless.finvibe.svc.cluster.local:6379"
            - name: SPRING_DATA_REDIS_CLUSTER_NODES
              value: "redis-cluster-0.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-1.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-2.redis-cluster-headless.finvibe.svc.cluster.local:6379"
            - name: SPRING_REDIS_CLUSTER_NODES
              value: "redis-cluster-0.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-1.redis-cluster-headless.finvibe.svc.cluster.local:6379,redis-cluster-2.redis-cluster-headless.finvibe.svc.cluster.local:6379"
            - name: JWT_ISSUER
              value: "finvibe-user"
            - name: WS_PRICE_TOPIC
              value: "market:price-updated"
            - name: WS_PRICE_TOPIC_PARTITION_COUNT
              value: "3"

            # [성능 튜닝 - fanout/queue 병목 완화]
            - name: WS_EVENT_DISPATCH_PARALLELISM
              value: "8"
            - name: WS_EVENT_DISPATCH_QUEUE_CAPACITY
              value: "4096"
            - name: WS_FANOUT_CHUNK_SIZE
              value: "128"
            - name: WS_FANOUT_CHUNK_PARALLELISM
              value: "8"
            - name: WS_FANOUT_CHUNK_QUEUE_CAPACITY
              value: "8192"
            - name: WS_SESSION_QUEUE_CAPACITY
              value: "4096"
            - name: WS_SLOW_CONSUMER_GRACE_MS
              value: "5000"

          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          ports:
            - containerPort: 8080
